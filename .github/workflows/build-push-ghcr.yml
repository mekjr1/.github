name: Build & Push to GHCR

on:
  workflow_call:
    inputs:
      image-name:
        description: 'Image name under ghcr.io/mekjr1/<image-name>'
        type: string
        required: true
      context:
        description: 'Docker build context path relative to repo root'
        type: string
        default: '.'
      dockerfile:
        description: 'Path to Dockerfile relative to repo root'
        type: string
        default: 'Dockerfile'
    outputs:
      image-tag:
        description: 'Full GHCR image reference pushed (uat tag)'
        value: ${{ jobs.build-push.outputs.image-tag }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ghcr.io/mekjr1/${{ inputs.image-name }}:uat
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/mekjr1/${{ inputs.image-name }}:uat
            ghcr.io/mekjr1/${{ inputs.image-name }}:uat-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
